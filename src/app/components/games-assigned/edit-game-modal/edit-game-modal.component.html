<div class="modal-backdrop" *ngIf="isOpen" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>
        <span *ngIf="currentStep === 1">{{ isCreateMode ? 'Kreiraj novu utakmicu' : 'Uredi utakmicu' }}</span>
        <span *ngIf="currentStep === 2">{{ isCreateMode ? 'Dodijeli suce' : 'Uredi suca' }}</span>
      </h2>
      <button class="close-btn" (click)="closeModal()" [disabled]="isLoading">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="step-indicator">
      <div class="step" [class.active]="currentStep === 1" [class.completed]="currentStep > 1">
        <span class="step-number">1</span>
        <span class="step-title">Detalji Utakmice</span>
      </div>
      <div class="step-divider"></div>
      <div class="step" [class.active]="currentStep === 2">
        <span class="step-number">2</span>
        <span class="step-title">{{ isCreateMode ? 'Dodijeli suce' : 'Uredi suca' }}</span>
      </div>
    </div>

    <div class="error-message" *ngIf="errorMessage">
      <i class="fas fa-exclamation-circle"></i>
      {{ errorMessage }}
    </div>

    <div class="modal-body">
      <div *ngIf="currentStep === 1" class="step-content">
        <app-game-details-step
          [gameForm]="gameForm"
          [competitions]="competitions"
          [statusOptions]="statusOptions"
          [teamOptions]="teamOptions"
          [awayTeamOptions]="awayTeamOptions"
          [venueOptions]="venueOptions"
          [hasTeamCatalog]="hasTeamCatalog"
          [teamsLocked]="!gameForm.competition"
          [isCreateMode]="isCreateMode"
          [canEditDetails]="canManageCalendar()"
          [minDate]="getMinDate()"
          (competitionChange)="onCompetitionChange()"
          (dateTimeChange)="onDateTimeChange()">
        </app-game-details-step>
      </div>

      <div *ngIf="currentStep === 2" class="step-content">
        <app-game-nominations-step
          [gameForm]="gameForm"
          [selectedReferees]="selectedReferees"
          [availableSudciForIndex]="availableSudciForIndex"
          [availableDelegati]="availableDelegati"
          [availableKontrolori]="availableKontrolori"
          [unavailableCounts]="unavailableCounts"
          [isLoadingReferees]="isLoadingReferees"
          [isLoadingAbsences]="isLoadingAbsences"
          [canNominate]="canNominateOfficials()"
          [showKontrolor]="showKontrolorField()"
          [kontrolorHeading]="kontrolorHeading()"
          [rejections]="rejections"
          (selectionChange)="onRefereeSelectionChange()">
        </app-game-nominations-step>
      </div>
    </div>

    <div class="modal-footer">
      <div class="footer-buttons">
        <ng-container *ngIf="currentStep === 1">
          <button type="button" class="btn btn-secondary" (click)="closeModal()" [disabled]="isLoading">
            Odustani
          </button>
          <button type="button" class="btn btn-primary" (click)="nextStep()" [disabled]="isLoading">
            {{ shouldShowNominations() ? 'Dalje' : (isCreateMode ? 'Kreiraj utakmicu' : 'Spremi') }} <i class="fas fa-arrow-right"></i>
          </button>
        </ng-container>

        <ng-container *ngIf="currentStep === 2">
          <button type="button" class="btn btn-secondary" (click)="previousStep()" [disabled]="isLoading">
            <i class="fas fa-arrow-left"></i> Nazad
          </button>
          <button type="button" class="btn btn-secondary" (click)="closeModal()" [disabled]="isLoading">
            Odustani
          </button>
          <button
            type="button"
            class="btn btn-success"
            (click)="saveGame()"
            [disabled]="isLoading || isLoadingReferees || isLoadingAbsences">
            <span *ngIf="!isLoading">
              {{ isCreateMode ? 'Kreiraj utakmicu' : 'Spremi' }}
            </span>
            <span *ngIf="isLoading">
              <i class="fas fa-spinner fa-spin"></i> Spremanje...
            </span>
          </button>
        </ng-container>
      </div>
    </div>
  </div>
</div>
