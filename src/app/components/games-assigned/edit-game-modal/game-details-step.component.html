<form class="game-form" [formGroup]="form">
  <div class="form-row" [class.form-row-single]="isCreateMode">
    <div class="form-group">
      <label for="competition">Natjecanje</label>
      <select
        id="competition"
        formControlName="competition"
        class="form-control"
        required>
        <option value="">Odaberite natjecanje</option>
        <option *ngFor="let comp of competitions" [value]="comp">{{ comp }}</option>
      </select>
    </div>
    <div class="form-group" *ngIf="!isCreateMode">
      <label for="status">Status</label>
      <select
        id="status"
        formControlName="status"
        class="form-control"
        required>
        <option *ngFor="let status of statusOptions" [value]="status.value">
          {{ status.label }}
        </option>
      </select>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="homeTeam">Domaći Tim</label>
      <select
        *ngIf="teamsLocked || hasTeamCatalog"
        id="homeTeam"
        formControlName="homeTeam"
        class="form-control"
        required>
        <option value="">{{ teamsLocked ? 'Prvo odaberite natjecanje' : 'Odaberite domaći tim' }}</option>
        <option *ngFor="let team of teamOptions" [value]="team">{{ team }}</option>
      </select>
      <input
        *ngIf="!teamsLocked && !hasTeamCatalog"
        type="text"
        id="homeTeam"
        formControlName="homeTeam"
        class="form-control"
        placeholder="Unesite naziv domaćeg tima"
        required>
    </div>
    <div class="form-group">
      <label for="awayTeam">Gostujući Tim</label>
      <select
        *ngIf="teamsLocked || hasTeamCatalog"
        id="awayTeam"
        formControlName="awayTeam"
        class="form-control"
        required>
        <option value="">{{ teamsLocked ? 'Prvo odaberite natjecanje' : 'Odaberite gostujući tim' }}</option>
        <option *ngFor="let team of awayTeamOptions" [value]="team">{{ team }}</option>
      </select>
      <input
        *ngIf="!teamsLocked && !hasTeamCatalog"
        type="text"
        id="awayTeam"
        formControlName="awayTeam"
        class="form-control"
        placeholder="Unesite naziv gostujućeg tima"
        required>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="date">Datum</label>
      <input
        type="date"
        id="date"
        formControlName="date"
        class="form-control"
        [min]="minDate"
        required>
    </div>
    <div class="form-group">
      <label id="game-time-label">Vrijeme</label>
      <app-time-select
        formControlName="time"
        [attr.aria-labelledby]="'game-time-label'">
      </app-time-select>
    </div>
  </div>

  <div class="form-group">
    <label for="venue">Dvorana</label>
    <app-venue-search
      id="venue"
      formControlName="venue"
      [options]="venueOptions">
    </app-venue-search>
  </div>

  <div class="form-group">
    <label for="notes">Napomene</label>
    <textarea
      id="notes"
      formControlName="notes"
      class="form-control"
      rows="3"
      placeholder="Dodatne napomene o utakmici (opcionalno)"></textarea>
  </div>
</form>
