<div class="main-layout">
  <section class="content">
    <div *ngIf="canManageCalendar() && !isLoading" class="admin-header">
      <h1 class="admin-title">Sve utakmice</h1>
      <button class="btn btn-primary btn-create-game" (click)="openCreateGameModal()">
        <i class="fas fa-plus"></i>
        Kreiraj Utakmicu
      </button>
    </div>

    <div *ngIf="!canManageCalendar() && !isLoading" class="header">
      <h1 class="title">Sve utakmice</h1>
    </div>

    <app-games-filter-bar
      *ngIf="!isLoading"
      [filterValues]="filterValues"
      [(isMobileOpen)]="isMobileFiltersOpen"
      (filterChange)="onFilterChange()"
      (clear)="clearFilters()">
    </app-games-filter-bar>

    <div *ngIf="!isLoading && hasActiveFilters" class="admin-filter-status">
      <span class="filter-indicator">
        <i class="fas fa-filter"></i>
        Filteri aktivni - Ukupno prikazano: {{ totalFilteredCount }}
      </span>
    </div>

    <div *ngIf="isLoading" class="loading-container">
      <div class="loading-spinner"></div>
      <p>Učitavanje utakmica...</p>
    </div>

    <div *ngIf="!isLoading">
      <app-games-list-section
        [title]="canSeeAllGames() ? 'Nadolazeće utakmice' : 'Nominacije koje čekaju odluku'"
        [emptyMessage]="canSeeAllGames() ? 'Nema nadolazećih utakmica' : 'Nema nominacija na čekanju'"
        [games]="pendingGames"
        [displayedGames]="pendingDisplayedGames"
        [page]="pendingPage"
        [totalPages]="pendingTotalPages"
        [pageNumbers]="getPendingPages()"
        [seeAllGames]="canSeeAllGames()"
        [userId]="viewerUserId()"
        [showOfficialActions]="!canSeeAllGames()"
        [showStatus]="canSeeAllGames()"
        [showOverviewActions]="canSeeAllGames()"
        [isResponding]="isResponding"
        [canEdit]="canEditListedGame"
        [canDelete]="canDeleteGame"
        (pageChange)="goToPendingPage($event)"
        (accept)="acceptAssignment($event)"
        (reject)="rejectAssignment($event)"
        (edit)="editGame($event)"
        (remove)="deleteGame($event)">
      </app-games-list-section>

      <app-games-list-section
        *ngIf="!canSeeAllGames()"
        title="Potvrđene nominacije"
        emptyMessage="Nema potvrđenih nominacija"
        [games]="confirmedGames"
        [displayedGames]="confirmedDisplayedGames"
        [page]="confirmedPage"
        [totalPages]="confirmedTotalPages"
        [pageNumbers]="getConfirmedPages()"
        [seeAllGames]="false"
        [userId]="viewerUserId()"
        [showStatus]="true"
        (pageChange)="goToConfirmedPage($event)">
      </app-games-list-section>

      <app-games-list-section
        title="Povijest utakmica"
        titleTag="h3"
        emptyMessage="Nema povijesti utakmica"
        [games]="gameHistory"
        [displayedGames]="historyDisplayedGames"
        [page]="historyPage"
        [totalPages]="historyTotalPages"
        [pageNumbers]="getHistoryPages()"
        [seeAllGames]="canSeeAllGames()"
        [userId]="viewerUserId()"
        [showStatus]="true"
        [showHistoryAdminActions]="isAdmin()"
        [canEdit]="canEditListedGame"
        [canDelete]="canDeleteGame"
        (pageChange)="goToHistoryPage($event)"
        (edit)="editGame($event)"
        (remove)="deleteGame($event)">
      </app-games-list-section>
    </div>
  </section>
</div>

<div class="toast-container">
  <div *ngIf="successMessage" class="toast toast-success">
    <span class="toast-emoji">✅</span>
    <span class="toast-message">{{ successMessage }}</span>
    <button class="toast-close" (click)="clearMessages()"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <div *ngIf="errorMessage" class="toast toast-error">
    <span class="toast-emoji">❌</span>
    <span class="toast-message">{{ errorMessage }}</span>
    <button class="toast-close" (click)="clearMessages()"><i class="fa-solid fa-xmark"></i></button>
  </div>
</div>

<app-reason-modal
  [isOpen]="isRejectionModalOpen"
  [isBusy]="isRejectBusy"
  title="Odbij nominaciju"
  label="Razlog odbijanja"
  placeholder="Molimo unesite razlog zašto odbijate ovu nominaciju..."
  confirmText="Odbij nominaciju"
  busyText="Odbijanje..."
  [minLength]="10"
  [details]="rejectionDetails"
  (close)="closeRejectionModal()"
  (confirm)="onRejectionConfirmed($event)">
</app-reason-modal>

<app-game-form-modal [isOpen]="isGameFormModalOpen" [game]="gameToEdit" (close)="closeGameFormModal()"
  (gameCreated)="onGameCreated($event)" (gameUpdated)="onGameUpdated($event)">
</app-game-form-modal>

<app-confirmation-modal [isOpen]="isConfirmationModalOpen" [isBusy]="isConfirmBusy"
  [confirmationData]="confirmationData" (close)="closeConfirmationModal()" (confirm)="onDeleteConfirmed($event)">
</app-confirmation-modal>

<app-confirmation-modal [isOpen]="isAcceptModalOpen" [isBusy]="isResponding"
  [confirmationData]="acceptConfirmationData" (close)="closeAcceptModal()" (confirm)="onAcceptConfirmed($event)">
</app-confirmation-modal>
