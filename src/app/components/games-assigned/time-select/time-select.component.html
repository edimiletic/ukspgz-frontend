<div class="time-select" role="group" aria-label="Vrijeme utakmice">
  <select
    class="form-control"
    name="timeHour"
    (change)="onHourChange($any($event.target).value)"
    [disabled]="disabled"
    aria-label="Sat">
    <option value="" [selected]="hour === ''">Sat</option>
    <option *ngFor="let h of hours" [value]="h" [selected]="hour === h">{{ h }}</option>
  </select>
  <span class="time-sep" aria-hidden="true">:</span>
  <select
    class="form-control"
    name="timeMinute"
    (change)="onMinuteChange($any($event.target).value)"
    [disabled]="disabled"
    aria-label="Minuta">
    <option value="" [selected]="minute === ''">Min</option>
    <option *ngFor="let m of minutes" [value]="m" [selected]="minute === m">{{ m }}</option>
  </select>
</div>
