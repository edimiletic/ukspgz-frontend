<div class="filter-section">
  <button
    type="button"
    class="mobile-filter-toggle"
    [class.active]="isMobileOpen"
    (click)="toggleMobile()"
    aria-controls="games-filter-panel"
    [attr.aria-expanded]="isMobileOpen">
    <i class="fas fa-filter" aria-hidden="true"></i>
    {{ isMobileOpen ? 'Sakrij filtere' : 'Prikaži filtere' }}
    <i class="fas fa-chevron-down" aria-hidden="true"></i>
  </button>

  <div id="games-filter-panel" class="filter-content" [class.open]="isMobileOpen">
    <form class="filter-row" [formGroup]="form">
      <div class="filter-group">
        <label for="games-filter-date">Datum</label>
        <input id="games-filter-date" type="date" class="form-control" formControlName="date">
      </div>
      <div class="filter-group">
        <label for="games-filter-venue">Mjesto</label>
        <input id="games-filter-venue" type="text" class="form-control" placeholder="Pretraži po mjestu" formControlName="venue">
      </div>
      <div class="filter-group">
        <label for="games-filter-home">Domaći tim</label>
        <input id="games-filter-home" type="text" class="form-control" placeholder="Pretraži po domaćem timu" formControlName="homeTeam">
      </div>
      <div class="filter-group">
        <label for="games-filter-away">Gostujući tim</label>
        <input id="games-filter-away" type="text" class="form-control" placeholder="Pretraži po gostujućem timu" formControlName="awayTeam">
      </div>
      <div class="filter-group">
        <label for="games-filter-competition">Natjecanje</label>
        <input id="games-filter-competition" type="text" class="form-control" placeholder="Pretraži po natjecanju" formControlName="competition">
      </div>
      <div class="filter-group">
        <button class="btn btn-outline-secondary filter-btn" type="button" (click)="clear.emit()">
          <i class="fas fa-times" aria-hidden="true"></i> Očisti
        </button>
      </div>
    </form>
  </div>
</div>
