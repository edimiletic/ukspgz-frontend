<div class="venue-search">
  <input
    type="text"
    class="form-control"
    role="combobox"
    [id]="inputId"
    [value]="query"
    (input)="onQueryChange($any($event.target).value)"
    (focus)="onFocus()"
    (keydown)="onInputKey($event)"
    [disabled]="disabled"
    [placeholder]="placeholder"
    autocomplete="off"
    aria-autocomplete="list"
    [attr.aria-expanded]="open && !disabled"
    [attr.aria-controls]="open && !disabled ? listboxId : null"
    [attr.aria-activedescendant]="activeOptionId"
    [attr.aria-label]="ariaLabel">

  <ul
    *ngIf="open && !disabled"
    [id]="listboxId"
    class="venue-results"
    role="listbox"
    [attr.aria-label]="ariaLabel">
    <li *ngIf="matches.length === 0" class="venue-hint" role="status">Nema dvorane s tim nazivom</li>
    <li
      *ngFor="let venue of matches; let i = index; trackBy: trackByVenue"
      [id]="optionId(i)"
      (mousedown)="choose(venue)"
      [class.active]="i === highlightedIndex"
      role="option"
      [attr.aria-selected]="i === highlightedIndex">
      {{ venue }}
    </li>
  </ul>
</div>
