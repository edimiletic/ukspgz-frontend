<div class="venue-search">
  <input
    type="text"
    class="form-control"
    role="combobox"
    aria-label="Dvorana"
    aria-autocomplete="list"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open && !disabled ? 'true' : 'false'"
    [attr.aria-controls]="listId"
    [attr.aria-activedescendant]="activeOptionId"
    [value]="query"
    (input)="onQueryChange($any($event.target).value)"
    (focus)="onFocus()"
    (keydown)="onKeydown($event)"
    [disabled]="disabled"
    [placeholder]="placeholder"
    autocomplete="off">

  <ul class="venue-results" *ngIf="open && !disabled" [id]="listId" role="listbox">
    <li *ngIf="matches.length === 0" class="venue-hint">Nema dvorane s tim nazivom</li>
    <li
      *ngFor="let venue of matches; let i = index; trackBy: trackByVenue"
      [id]="optionId(i)"
      (mousedown)="choose(venue)"
      [class.active]="i === activeIndex"
      role="option"
      [attr.aria-selected]="i === activeIndex">
      {{ venue }}
    </li>
  </ul>
</div>
