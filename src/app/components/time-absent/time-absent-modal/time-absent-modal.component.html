<div class="modal-overlay" *ngIf="isOpen" (click)="onOverlayClick($event)">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ isCreateMode ? 'Kreiraj odsustvo' : 'Uredi odsustvo' }}</h3>
      <button class="btn-close" type="button" (click)="closeModal()" [disabled]="isSubmitting">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Početak odsustva <span class="required">*</span></label>
        <input
          type="date"
          class="form-control"
          [(ngModel)]="startDate"
          [min]="todayDate"
          (change)="onStartDateChange()"
          [disabled]="startDateLocked"
          required>
      </div>
      <div class="form-group">
        <label>Kraj odsustva <span class="required">*</span></label>
        <input
          type="date"
          class="form-control"
          [(ngModel)]="endDate"
          [min]="minEndDate"
          [disabled]="endDateLocked || !startDate"
          required>
      </div>
      <div class="form-group">
        <label>Razlog</label>
        <textarea
          class="form-control"
          rows="3"
          [(ngModel)]="reason"
          placeholder="Unesite razlog odsustva..."></textarea>
      </div>
      <div class="info-note" *ngIf="absence && endDateLocked">
        <i class="icon-info">ℹ️</i>
        <span>Napomena: Ovo odsustvo je već završeno ({{ formatDate(absence.endDate) }}), možete urediti samo razlog.</span>
      </div>
      <div class="info-note" *ngIf="absence && startDateLocked && !endDateLocked">
        <i class="icon-info">ℹ️</i>
        <span>Napomena: Odsustvo je već počelo, početni datum se ne može mijenjati.</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" (click)="closeModal()" [disabled]="isSubmitting">Odustani</button>
      <button
        class="btn btn-primary"
        type="button"
        [disabled]="!isFormValid() || isSubmitting"
        (click)="save()">
        <span *ngIf="isSubmitting">Spremanje...</span>
        <span *ngIf="!isSubmitting">Spremi</span>
      </button>
    </div>
  </div>
</div>
