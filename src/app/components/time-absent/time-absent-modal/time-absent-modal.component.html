<div class="modal-overlay" *ngIf="isOpen" (click)="onOverlayClick($event)">
  <div
    class="modal-content"
    appModalPanel
    [appModalBusy]="isSubmitting"
    aria-labelledby="absence-modal-title"
    (dismiss)="closeModal()"
    (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 id="absence-modal-title">{{ isCreateMode ? 'Kreiraj odsustvo' : 'Uredi odsustvo' }}</h3>
      <button class="btn-close" type="button" (click)="closeModal()" [disabled]="isSubmitting" aria-label="Zatvori">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
    <div class="modal-body" [formGroup]="form">
      <div class="form-group">
        <label for="absence-start">Početak odsustva <span class="required">*</span></label>
        <input
          id="absence-start"
          type="date"
          class="form-control"
          formControlName="startDate"
          [min]="todayDate"
          (change)="onStartDateChange()"
          required>
      </div>
      <div class="form-group">
        <label for="absence-end">Kraj odsustva <span class="required">*</span></label>
        <input
          id="absence-end"
          type="date"
          class="form-control"
          formControlName="endDate"
          [min]="minEndDate"
          required>
      </div>
      <div class="form-group">
        <label for="absence-reason">Razlog</label>
        <textarea
          id="absence-reason"
          class="form-control"
          rows="3"
          formControlName="reason"
          placeholder="Unesite razlog odsustva..."></textarea>
      </div>
      <div class="info-note" *ngIf="absence && endDateLocked">
        <i class="fas fa-info-circle"></i>
        <span>Napomena: Ovo odsustvo je već završeno ({{ formatDate(absence.endDate) }}), možete urediti samo razlog.</span>
      </div>
      <div class="info-note" *ngIf="absence && startDateLocked && !endDateLocked">
        <i class="fas fa-info-circle"></i>
        <span>Napomena: Odsustvo je već počelo, početni datum se ne može mijenjati.</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" (click)="closeModal()" [disabled]="isSubmitting">Odustani</button>
      <button
        class="btn btn-primary"
        type="button"
        [disabled]="!isFormValid() || isSubmitting"
        (click)="save()">
        <span *ngIf="isSubmitting">Spremanje...</span>
        <span *ngIf="!isSubmitting">Spremi</span>
      </button>
    </div>
  </div>
</div>
