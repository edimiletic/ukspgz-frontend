<div class="filters-section">
  <button class="mobile-filter-toggle" [class.active]="isMobileFiltersOpen" (click)="toggleMobileFilters()">
    <i class="fas fa-filter"></i>
    {{ isMobileFiltersOpen ? 'Sakrij filtere' : 'Prikaži filtere' }}
    <i class="fas fa-chevron-down"></i>
  </button>

  <div class="filter-content" [class.open]="isMobileFiltersOpen">
    <h2>Filteri</h2>
    <div class="filters-grid">
      <div class="filter-group">
        <label for="role">Uloga:</label>
        <select id="role" [ngModel]="selectedRole" (ngModelChange)="selectedRoleChange.emit($event); roleChange.emit()"
          class="form-control" [disabled]="statisticsRoles.length <= 1">
          <option *ngFor="let role of statisticsRoles; trackBy: trackByName" [value]="role">{{ role }}</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="period">Vremensko razdoblje:</label>
        <select id="period" [ngModel]="selectedPeriod"
          (ngModelChange)="selectedPeriodChange.emit($event); periodChange.emit()" class="form-control">
          <option value="month">Mjesec</option>
          <option value="year">Godina</option>
          <option value="season">Sezona</option>
          <option value="custom">Prilagođeno</option>
        </select>
      </div>

      <div class="filter-group" *ngIf="selectedPeriod === 'month'">
        <label for="month">Mjesec:</label>
        <select id="month" [ngModel]="selectedMonth"
          (ngModelChange)="selectedMonthChange.emit($event); filtersChange.emit()" class="form-control">
          <option *ngFor="let month of months; trackBy: trackByMonth" [value]="month.value">{{ month.label }}</option>
        </select>
      </div>

      <div class="filter-group" *ngIf="selectedPeriod === 'month' || selectedPeriod === 'year'">
        <label for="year">Godina:</label>
        <input type="number" id="year" [ngModel]="selectedYear"
          (ngModelChange)="selectedYearChange.emit($event); filtersChange.emit()" class="form-control" min="2020"
          max="2030">
      </div>

      <div class="filter-group" *ngIf="selectedPeriod === 'season'">
        <label for="season">Sezona:</label>
        <select id="season" [ngModel]="selectedSeason"
          (ngModelChange)="selectedSeasonChange.emit($event); filtersChange.emit()" class="form-control">
          <option value="2023/2024">2023/2024</option>
          <option value="2024/2025">2024/2025</option>
          <option value="2025/2026">2025/2026</option>
        </select>
      </div>

      <div class="filter-group" *ngIf="selectedPeriod === 'custom'">
        <label for="startDate">Od datuma:</label>
        <input type="date" id="startDate" [ngModel]="startDate"
          (ngModelChange)="startDateChange.emit($event); filtersChange.emit()" class="form-control">
      </div>

      <div class="filter-group" *ngIf="selectedPeriod === 'custom'">
        <label for="endDate">Do datuma:</label>
        <input type="date" id="endDate" [ngModel]="endDate"
          (ngModelChange)="endDateChange.emit($event); filtersChange.emit()" class="form-control">
      </div>

      <div class="filter-group">
        <label for="competition">Natjecanje:</label>
        <select id="competition" [ngModel]="selectedCompetition"
          (ngModelChange)="selectedCompetitionChange.emit($event); filtersChange.emit()" class="form-control">
          <option value="">Sva natjecanja</option>
          <option *ngFor="let comp of competitions; trackBy: trackByName" [value]="comp">{{ comp }}</option>
        </select>
      </div>

      <div class="filter-group">
        <label>&nbsp;</label>
        <button class="btn btn-outline-secondary filter-btn" (click)="clear.emit()">
          <i class="fas fa-times"></i> Očisti
        </button>
      </div>
    </div>
  </div>
</div>
