<div class="filters-section">
  <button type="button" class="mobile-filter-toggle" [class.active]="isMobileFiltersOpen" (click)="toggleMobileFilters()" [attr.aria-expanded]="isMobileFiltersOpen">
    <i class="fas fa-filter" aria-hidden="true"></i>
    {{ isMobileFiltersOpen ? 'Sakrij filtere' : 'Prikaži filtere' }}
    <i class="fas fa-chevron-down" aria-hidden="true"></i>
  </button>

  <div class="filter-content" [class.open]="isMobileFiltersOpen">
    <h2>Filteri</h2>
    <div class="filters-grid">
      <div class="filter-group">
        <label for="role">Uloga:</label>
        <select id="role" [value]="selectedRole"
          (change)="onRole($event)"
          class="form-control" [disabled]="statisticsRoles.length <= 1">
          <option *ngFor="let role of statisticsRoles; trackBy: trackByName" [value]="role">{{ role }}</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="period">Vremensko razdoblje:</label>
        <select id="period" [value]="selectedPeriod"
          (change)="onPeriod($event)" class="form-control">
          <option value="month">Mjesec</option>
          <option value="year">Godina</option>
          <option value="season">Sezona</option>
          <option value="custom">Prilagođeno</option>
        </select>
      </div>

      <div class="filter-group" *ngIf="selectedPeriod === 'month'">
        <label for="month">Mjesec:</label>
        <select id="month" [value]="selectedMonth"
          (change)="onMonth($event)" class="form-control">
          <option *ngFor="let month of months; trackBy: trackByMonth" [value]="month.value">{{ month.label }}</option>
        </select>
      </div>

      <div class="filter-group" *ngIf="selectedPeriod === 'month' || selectedPeriod === 'year'">
        <label for="year">Godina:</label>
        <input type="number" id="year" [value]="selectedYear"
          (input)="onYear($event)" class="form-control" min="2020"
          max="2030">
      </div>

      <div class="filter-group" *ngIf="selectedPeriod === 'season'">
        <label for="season">Sezona:</label>
        <select id="season" [value]="selectedSeason"
          (change)="onSeason($event)" class="form-control">
          <option *ngFor="let season of seasons; trackBy: trackBySeason" [value]="season.value">{{ season.label }}</option>
        </select>
      </div>

      <div class="filter-group" *ngIf="selectedPeriod === 'custom'">
        <label for="startDate">Od datuma:</label>
        <input type="date" id="startDate" [value]="startDate"
          (change)="onStartDate($event)" class="form-control">
      </div>

      <div class="filter-group" *ngIf="selectedPeriod === 'custom'">
        <label for="endDate">Do datuma:</label>
        <input type="date" id="endDate" [value]="endDate"
          (change)="onEndDate($event)" class="form-control">
      </div>

      <div class="filter-group">
        <label for="competition">Natjecanje:</label>
        <select id="competition" [value]="selectedCompetition"
          (change)="onCompetition($event)" class="form-control">
          <option value="">Sva natjecanja</option>
          <option *ngFor="let comp of competitions; trackBy: trackByName" [value]="comp">{{ comp }}</option>
        </select>
      </div>

      <div class="filter-group">
        <label>&nbsp;</label>
        <button class="btn btn-outline-secondary filter-btn" type="button" (click)="clear.emit()">
          <i class="fas fa-times" aria-hidden="true"></i> Očisti
        </button>
      </div>
    </div>
  </div>
</div>
