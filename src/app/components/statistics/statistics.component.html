<div class="statistika-container">
  <div class="header">
    <h1>
      <i class="fas fa-chart-bar"></i>
      Statistike
    </h1>
  </div>

  <app-statistics-filters
    [(selectedRole)]="selectedRole"
    [statisticsRoles]="statisticsRoles"
    [(selectedPeriod)]="selectedPeriod"
    [(selectedMonth)]="selectedMonth"
    [(selectedYear)]="selectedYear"
    [(selectedSeason)]="selectedSeason"
    [(startDate)]="startDate"
    [(endDate)]="endDate"
    [(selectedCompetition)]="selectedCompetition"
    [(isMobileFiltersOpen)]="isMobileFiltersOpen"
    (roleChange)="onRoleChange()"
    (periodChange)="onPeriodChange()"
    (filtersChange)="onFiltersChange()"
    (clear)="clearAllFilters()">
  </app-statistics-filters>

  <div class="loading-section" *ngIf="isLoading">
    <div class="loading-spinner"></div>
    <p>Učitavanje statistika...</p>
  </div>

  <app-statistics-results
    *ngIf="!isLoading"
    [selectedRole]="selectedRole"
    [totalGamesInPeriod]="totalGamesInPeriod"
    [totalRefereesActive]="totalRefereesActive"
    [mostActiveReferee]="mostActiveReferee"
    [refereeStats]="refereeStats"
    [competitionStats]="competitionStats"
    [absenceStats]="absenceStats"
    [expenseStats]="expenseStats"
    [gradeStats]="gradeStats">
  </app-statistics-results>
</div>
