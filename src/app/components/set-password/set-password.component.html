<div class="page-container">
  <div class="login-container">
    <div class="logo-image">
      <img class="logo" src="assets/HKS_Logo.webp" alt="logo image">
    </div>
    <h2>Postavi lozinku</h2>

    <div class="error-message" *ngIf="errorMessage">
      <i class="fas fa-exclamation-circle"></i>
      {{ errorMessage }}
    </div>
    <div class="success-message" *ngIf="successMessage">
      <i class="fas fa-check-circle"></i>
      {{ successMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" *ngIf="!successMessage">
      <div class="form-group">
        <input
          type="password"
          name="password"
          placeholder="Nova lozinka (min. 8 znakova)"
          [(ngModel)]="password"
          [disabled]="isLoading"
          required
        />
      </div>
      <div class="form-group">
        <input
          type="password"
          name="confirmPassword"
          placeholder="Ponovi lozinku"
          [(ngModel)]="confirmPassword"
          [disabled]="isLoading"
          required
        />
      </div>
      <button type="submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Spremi lozinku</span>
        <span *ngIf="isLoading">
          <i class="fas fa-spinner fa-spin"></i> Spremanje...
        </span>
      </button>
    </form>

    <p class="auth-hint">
      <a routerLink="/login">Natrag na prijavu</a>
    </p>
  </div>
</div>
