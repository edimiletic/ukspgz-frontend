<div class="page-container">
  <div class="login-container">
    <div class="logo-image">
      <img class="logo" src="assets/HKS_Logo.webp" alt="Hrvatski košarkaški savez">
    </div>
    <h2 id="set-password-heading">Postavi lozinku</h2>

    <div class="error-message" *ngIf="errorMessage" role="alert">
      <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
      {{ errorMessage }}
    </div>
    <div class="success-message" *ngIf="successMessage" role="status">
      <i class="fas fa-check-circle" aria-hidden="true"></i>
      {{ successMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" [formGroup]="form" *ngIf="!successMessage" aria-labelledby="set-password-heading">
      <div class="form-group">
        <label for="new-password">Nova lozinka</label>
        <input
          id="new-password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched ? true : null"
          required
        />
        <p class="auth-hint">Najmanje 10 znakova, slovo i broj.</p>
      </div>
      <div class="form-group">
        <label for="confirm-password">Ponovi lozinku</label>
        <input
          id="confirm-password"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          [attr.aria-invalid]="form.controls.confirmPassword.invalid && form.controls.confirmPassword.touched ? true : null"
          required
        />
      </div>
      <button type="submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Spremi lozinku</span>
        <span *ngIf="isLoading">
          <i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Spremanje...
        </span>
      </button>
    </form>

    <p class="auth-hint">
      <a routerLink="/login">Natrag na prijavu</a>
    </p>
  </div>
</div>
