<!-- src/app/components/header/header.component.html -->
<header class="header" #appHeader>
  <button
    *ngIf="showMenuButton"
    type="button"
    class="hamburger-btn"
    [class.active]="isMenuOpen"
    (click)="toggleMenu()"
    aria-label="Izbornik"
    aria-controls="glavni-izbornik"
    [attr.aria-expanded]="isMenuOpen">
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
  </button>
  <button type="button" class="logo-home" (click)="navigateToPage('/home')" aria-label="Početna stranica">
    <img class="logo" src="assets/HKS_Logo.webp" alt="">
  </button>
  <h1 class="title-full">Hrvatski Košarkaški Savez</h1>
    <h1 class="title-short">HKS</h1>
  <div class="user-info">
    <div class="header-buttons">
      
      <!-- Notification Bell -->
      <div class="notification-dropdown" [class.open]="isNotificationsOpen">
        <button
          type="button"
          class="notification-icon"
          [class.has-notifications]="hasUnreadNotifications"
          (click)="toggleNotifications($event)"
          aria-label="Obavijesti"
          aria-haspopup="true"
          [attr.aria-expanded]="isNotificationsOpen">
          <i class="fas fa-bell" aria-hidden="true"></i>
          <span *ngIf="unreadCount > 0" class="notification-badge">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
        </button>
        <div class="dropdown-menu notification-menu" *ngIf="isNotificationsOpen" (click)="$event.stopPropagation()">
          <div class="notification-header">
            <span>Obavijesti</span>
            <button *ngIf="notifications.length > 0" class="mark-all-read" type="button" (click)="markAllAsRead()">
              Označi sve kao pročitano
            </button>
          </div>
          
          <div class="notification-list">
            <div *ngIf="notifications.length === 0" class="no-notifications">
              Nema novih obavijesti
            </div>
            
            <button
              type="button"
              *ngFor="let notification of notifications; trackBy: trackByNotificationId"
              class="notification-item"
              [class.unread]="!notification.isRead"
              (click)="markAsRead(notification)">
              <div class="notification-content">
                <i
                  class="notification-type-icon"
                  [ngClass]="notificationIcon(notification)"
                  [class.accepted]="responseKind(notification) === 'accepted'"
                  [class.rejected]="responseKind(notification) === 'rejected'"
                  aria-hidden="true"></i>
                <div class="notification-body">
                  <div class="notification-text">{{ displayMessage(notification.message) }}</div>
                  <div class="notification-meta">
                    <span class="notification-time">{{ formatNotificationTime(notification.createdAt) }}</span>
                    <span *ngIf="!notification.isRead" class="unread-dot"></span>
                  </div>
                </div>
              </div>
            </button>
          </div>
          
          <div *ngIf="notifications.length > 3" class="notification-footer">
<button class="view-all-btn" type="button" (click)="viewAllNotifications()">
  Prikaži sve obavijesti
</button>
          </div>
        </div>
      </div>

      <!-- User Dropdown -->
      <div class="user-dropdown" [class.open]="isUserMenuOpen">
        <button
          type="button"
          class="user-icon"
          (click)="toggleUserMenu($event)"
          aria-label="Korisnički izbornik"
          aria-haspopup="true"
          [attr.aria-expanded]="isUserMenuOpen">
          <i class="fas fa-user" aria-hidden="true"></i>
        </button>
        <div class="dropdown-menu" *ngIf="isUserMenuOpen" (click)="$event.stopPropagation()">
          <button type="button" class="dropdown-item" (click)="openChangePassword()">Promijeni lozinku</button>
          <button type="button" class="dropdown-item" (click)="logout()">Odjava</button>
        </div>
      </div>
    </div>
  </div>
</header>
<app-change-password-modal
  [isOpen]="isChangePasswordOpen"
  (close)="closeChangePassword()">
</app-change-password-modal>
