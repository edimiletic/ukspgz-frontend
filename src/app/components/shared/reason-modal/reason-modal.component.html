<div class="modal-overlay" *ngIf="isOpen" (click)="onOverlayClick($event)">
  <div
    class="modal-content"
    appModalPanel
    [appModalBusy]="isBusy"
    aria-labelledby="reason-modal-title"
    (dismiss)="closeModal()"
    (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 id="reason-modal-title">{{ title }}</h3>
      <button class="btn-close" type="button" (click)="closeModal()" [disabled]="isBusy" aria-label="Zatvori">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <div class="modal-body">
      <p class="lead" *ngIf="message">{{ message }}</p>
      <p class="detail" *ngFor="let line of details; trackBy: trackByDetail">{{ line }}</p>

      <form [formGroup]="form">
      <label class="form-label" for="reason-field">{{ label }}<span class="required">*</span></label>
      <textarea
        id="reason-field"
        class="form-control"
        rows="4"
        formControlName="reason"
        [placeholder]="placeholder"
        [maxlength]="maxLength"></textarea>
      <div class="character-count">{{ reason.length }}/{{ maxLength }} znakova</div>
      <p class="error-text" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
      </form>
    </div>

    <div class="button-group">
      <button type="button" class="btn btn-outline-secondary" (click)="closeModal()" [disabled]="isBusy">
        Odustani
      </button>
      <button type="button" class="btn btn-danger" (click)="confirmAction()" [disabled]="isBusy || !isFormValid">
        <span *ngIf="isBusy">{{ busyText }}</span>
        <span *ngIf="!isBusy">{{ confirmText }}</span>
      </button>
    </div>
  </div>
</div>
