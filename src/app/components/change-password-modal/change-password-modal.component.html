<div class="modal-overlay" *ngIf="isOpen" (click)="onOverlayClick($event)">
  <div
    class="modal-container"
    appModalPanel
    [appModalBusy]="isBusy"
    (dismiss)="close.emit()"
    aria-labelledby="change-password-title"
    style="max-width: 420px">
    <div class="modal-header">
      <h3 id="change-password-title">Promijeni lozinku</h3>
      <button class="close-btn" type="button" (click)="close.emit()" [disabled]="isBusy" aria-label="Zatvori">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <form class="modal-body" (ngSubmit)="submit()" [formGroup]="form">
      <div class="form-group">
        <label for="current-password">Trenutna lozinka</label>
        <input
          id="current-password"
          type="password"
          formControlName="currentPassword"
          autocomplete="current-password" />
      </div>
      <div class="form-group" style="margin-top: 0.75rem">
        <label for="new-password">Nova lozinka</label>
        <input
          id="new-password"
          type="password"
          formControlName="newPassword"
          autocomplete="new-password" />
      </div>
      <div class="form-group" style="margin-top: 0.75rem">
        <label for="confirm-password">Ponovi novu lozinku</label>
        <input
          id="confirm-password"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password" />
      </div>
      <p class="form-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
      <p class="form-error" *ngIf="successMessage" role="status" style="color: #155724">{{ successMessage }}</p>
      <div class="form-actions">
        <button type="button" class="cancel-btn" (click)="close.emit()" [disabled]="isBusy">Odustani</button>
        <button type="submit" class="save-btn" [disabled]="isBusy">
          {{ isBusy ? 'Spremanje...' : 'Spremi' }}
        </button>
      </div>
    </form>
  </div>
</div>
