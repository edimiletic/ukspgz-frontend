<div class="modal-overlay" *ngIf="isOpen" (click)="onOverlayClick($event)">
  <div class="modal-container" role="dialog" aria-modal="true" style="max-width: 420px">
    <div class="modal-header">
      <h3>Promijeni lozinku</h3>
      <button class="close-btn" type="button" (click)="close.emit()" [disabled]="isBusy" aria-label="Zatvori">
        <span>&times;</span>
      </button>
    </div>
    <form class="modal-body" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="current-password">Trenutna lozinka</label>
        <input id="current-password" type="password" name="currentPassword" [(ngModel)]="currentPassword" [disabled]="isBusy" />
      </div>
      <div class="form-group" style="margin-top: 0.75rem">
        <label for="new-password">Nova lozinka</label>
        <input id="new-password" type="password" name="newPassword" [(ngModel)]="newPassword" [disabled]="isBusy" />
      </div>
      <div class="form-group" style="margin-top: 0.75rem">
        <label for="confirm-password">Ponovi novu lozinku</label>
        <input id="confirm-password" type="password" name="confirmPassword" [(ngModel)]="confirmPassword" [disabled]="isBusy" />
      </div>
      <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="form-error" *ngIf="successMessage" style="color: #155724">{{ successMessage }}</p>
      <div class="form-actions">
        <button type="button" class="cancel-btn" (click)="close.emit()" [disabled]="isBusy">Odustani</button>
        <button type="submit" class="save-btn" [disabled]="isBusy">
          {{ isBusy ? 'Spremanje...' : 'Spremi' }}
        </button>
      </div>
    </form>
  </div>
</div>
