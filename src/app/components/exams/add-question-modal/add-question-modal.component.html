<div class="modal-overlay" *ngIf="isOpen" (click)="onBackdropClick($event)">
  <div
    class="modal-container"
    appModalPanel
    [appModalBusy]="isSubmitting"
    aria-labelledby="question-modal-title"
    (dismiss)="close()"
    (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 id="question-modal-title">{{ isEditMode ? 'Uredi pitanje' : 'Kreiraj novo pitanje' }}</h3>
      <button class="close-btn" (click)="close()" type="button" aria-label="Zatvori">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div class="modal-body">
      <form (ngSubmit)="onSubmit()" [formGroup]="form">
        <div class="form-group">
          <label for="questionText">Tekst pitanja *</label>
          <textarea
            id="questionText"
            formControlName="questionText"
            required
            rows="4"
            placeholder="Unesite tekst pitanja..."
          ></textarea>
          <div class="validation-error" *ngIf="form.controls.questionText.invalid && form.controls.questionText.touched">
            Tekst pitanja je obavezan.
          </div>
        </div>

        <div class="form-group">
          <span id="correct-answer-label">Točan odgovor *</span>
          <div class="radio-group" role="radiogroup" aria-labelledby="correct-answer-label">
            <div class="radio-option">
              <input
                type="radio"
                id="answerTrue"
                formControlName="correctAnswer"
                [value]="true"
              >
              <label for="answerTrue">Da (Točno)</label>
            </div>
            <div class="radio-option">
              <input
                type="radio"
                id="answerFalse"
                formControlName="correctAnswer"
                [value]="false"
              >
              <label for="answerFalse">Ne (Netočno)</label>
            </div>
          </div>
        </div>

        <div class="form-group" *ngIf="isEditMode">
          <label class="checkbox-label" for="question-active">
            <input id="question-active" type="checkbox" formControlName="isActive">
            Aktivno (ulazi u nasumični ispit)
          </label>
        </div>

        <div class="error-message" *ngIf="error" role="alert">
          {{ error }}
        </div>

        <div class="form-actions">
          <button type="button" class="cancel-btn" (click)="close()" [disabled]="isSubmitting">
            Odustani
          </button>
          <button
            type="submit"
            class="submit-btn"
            [disabled]="form.invalid || isSubmitting"
          >
            {{ isSubmitting ? 'Spremam...' : (isEditMode ? 'Spremi pitanje' : 'Dodaj pitanje') }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
